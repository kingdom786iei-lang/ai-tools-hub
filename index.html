<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Tools Hub - Free Premium AI Tools</title>
    <!-- Tailwind CSS CDN for Super Fast Loading -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-white font-sans selection:bg-purple-500 min-h-screen">

    <!-- Header -->
    <header class="border-b border-slate-800 p-5 flex justify-between items-center max-w-6xl mx-auto">
        <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
            SmartAITools.Hub
        </h1>
        <span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-xs font-mono">AdSense Ready v1.0</span>
    </header>

    <!-- Main Hub -->
    <main class="max-w-4xl mx-auto mt-12 px-4 text-center">
        <h2 class="text-4xl md:text-5xl font-black mb-4">
            Free Premium <span class="text-purple-500">AI Tools</span> Daily
        </h2>
        <p class="text-slate-400 mb-8">Generate viral tags, hooks, and descriptions instantly with zero fees.</p>

        <!-- Tool Box -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl text-left">
            <label class="block text-sm font-semibold mb-2 text-purple-400">Enter your main video/blog topic:</label>
            <input 
                id="toolInput"
                type="text" 
                placeholder="e.g., how to earn money online" 
                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-purple-500 transition mb-4"
            />
            <button 
                onclick="generateAITags()"
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 font-bold py-3 px-6 rounded-xl transition shadow-lg shadow-purple-500/20 cursor-pointer"
            >
                Magic AI Generate ⚡
            </button>

            <!-- Result Block -->
            <div id="resultBlock" class="mt-6 p-4 bg-slate-900 rounded-xl border border-dashed border-purple-500/50 hidden">
                <h4 class="text-xs font-mono text-slate-500 mb-2 uppercase tracking-wider">Generated Output:</h4>
                <p id="resultText" class="text-slate-200 font-medium selection:bg-pink-500"></p>
            </div>
        </div>

        <!-- AdSense Banner Placeholder -->
        <div class="my-10 p-8 bg-slate-800/40 rounded-xl border border-slate-700/50 text-xs text-slate-500 font-mono tracking-widest text-center">
            [ HIGH CPC ADSENSE BANNER PLACEHOLDER - CODE WILL GO HERE ]
        </div>
    </main>

    <script>
        function generateAITags() {
            const input = document.getElementById('toolInput').value;
            const resultBlock = document.getElementById('resultBlock');
            const resultText = document.getElementById('resultText');

            if(!input.trim()) {
                alert('Jani, pehle topic to likho!');
                return;
            }

            // King's automated logic for high-volume SEO keywords
            const words = input.trim().split(/\s+/);
            const premiumTags = words.map(w => `#${w}AI #${w}Viral #${w}Trends`).join(' ');

            resultText.innerText = premiumTags + " #AItools #Automation #Trending2026";
            resultBlock.classList.remove('hidden');
        }
    </script>
</body>
</html>
